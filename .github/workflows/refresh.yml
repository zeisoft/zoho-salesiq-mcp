name: Refresh from the catalogue

# The README here is generated from HeyMetra's live connector catalogue. This job
# re-renders it and commits ONLY when something actually changed, so the date on
# the last commit means what it says.
#
# Daily rather than hourly on purpose: the catalogue does not change more than
# once a day, and a schedule that commits nothing 23 times a day is noise in
# every sense that matters.

on:
  schedule:
    - cron: "27 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render from the live catalogue
        run: python3 tools/render.py zoho-salesiq --inplace

      - name: Open and merge a pull request, but only if something changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "The catalogue says the same thing it said yesterday. Nothing to do."
            exit 0
          fi

          # A pull request rather than a push to main. The organisation requires one,
          # and this token is not on the bypass list — measured, not assumed: a direct
          # push answered GH013 and the job failed with the README already regenerated.
          # Going through a pull request satisfies the rule instead of widening it for
          # the other sixty repositories that rely on it.
          git config user.name "heymetra-docs"
          git config user.email "hello@heymetra.com"
          BRANCH="refresh/$(date -u +%Y%m%d-%H%M%S)"
          git switch -qc "$BRANCH"
          git commit -qam "docs: refresh zoho-salesiq from the connector catalogue"
          git push -q origin "$BRANCH"
          gh pr create --base main --head "$BRANCH"             --title "docs: refresh zoho-salesiq from the connector catalogue"             --body "The connector catalogue changed. This is the README regenerated from it."
          gh pr merge "$BRANCH" --squash --delete-branch
